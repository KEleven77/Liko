name: Build theme package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json
      - komari-theme.json
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        run: npm run package

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: theme-package
          path: |
            *.zip
            preview.png

      - name: Resolve release version
        id: release-version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('komari-theme.json', 'utf8')).version")
          tag="v${version}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "Tag and manifest versions differ"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            status=$(curl -sS -o /tmp/liko-release.json -w '%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
            if [[ "$status" == 404 ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            elif [[ "$status" == 200 ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "Release lookup failed: HTTP $status"; exit 1
            fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve release notes
        if: steps.release-version.outputs.publish == 'true'
        id: release-notes
        shell: bash
        run: |
          notes=".github/release-notes/${{ steps.release-version.outputs.tag }}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${{ steps.release-version.outputs.tag }}" > default-notes.md
            echo "path=default-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.release-version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            *.zip
            preview.png
          body_path: ${{ steps.release-notes.outputs.path }}
